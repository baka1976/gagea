<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4EEE3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="가계부" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
<style>
:root {
  --paper: #F2E9D8;
  --paper-line: #DCCBA0;
  --card: #FFFDF7;
  --ink: #2B3A4A;
  --ink-soft: #6B7280;
  --seal: #B23A24;
  --seal-soft: #B23A2422;
  --income: #3D6B4F;
  --serif: 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--paper-line) 28px), var(--paper);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

.app {
  max-width: 460px; margin: 0 auto;
  padding: max(24px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
}

/* 헤더 */
.head { text-align: center; margin-bottom: 16px; position: relative; }
.gear { position: absolute; right: 0; top: 2px; background: none; border: none; color: var(--ink-soft); padding: 6px; }
.title { font-family: var(--serif); font-weight: 800; font-size: 29px; letter-spacing: 2px; margin: 0; }
.rule { width: 46px; height: 3px; background: var(--seal); margin: 6px auto 9px; border-radius: 2px; }
.sub { font-size: 12.5px; color: var(--ink-soft); }

/* 검수함 */
.inbox { background: #F7EFDC; border: 1px solid #D9BE84; border-radius: 8px; padding: 12px 13px; margin-bottom: 12px; }
.inboxHead { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #7A5A17; margin-bottom: 9px;
  width: 100%; background: none; border: none; padding: 0; text-align: left; }
.cardLabel > span { font: inherit; }
.tidyHead { font-size: 12px; font-weight: 700; color: #7A5A17; margin-bottom: 6px; }
.undoBar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft);
  padding: 8px 12px; margin-bottom: 10px; border: 1px dashed var(--paper-line); border-radius: 8px; }
.undoBar .btn { margin-left: auto; }
.inboxCaret { margin-left: auto; font-size: 11px; color: #B0A48A; }
.inbox.warn { background: #F5DDD6; border-color: #D9A08C; }
.inbox.warn .inboxHead { color: #7A2A18; }
.inbox.warn .inboxBulk { border-top-color: #D9A08C; color: #7A2A18; }
.inboxItem { border-top: 1px dashed #D9BE84; padding-top: 9px; margin-top: 9px; }
.inboxItem:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.inboxTop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.inboxMemo { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inboxAmt { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.inboxSub { font-size: 11.5px; color: #8A6F2E; margin: 3px 0 7px; }
.inboxHint { font-size: 10.5px; font-weight: 500; color: #8A6F2E; margin-left: auto; }
.inboxBulk { font-size: 12px; color: #7A5A17; line-height: 1.6; padding: 8px 0 2px; border-top: 1px dashed #D9BE84; margin-top: 8px; }
.inboxBulk .btn { margin-top: 7px; margin-right: 6px; }
.soloTag { flex-shrink: 0; margin-left: 6px; font-size: 10.5px; padding: 2px 7px; border-radius: 9px;
  border: 1px solid var(--paper-line); background: none; color: #B0A48A; }
.soloTag.on { background: var(--seal); border-color: var(--seal); color: #FBF3E7; }
.setNote { font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-left: 4px; }
.planShareOpt { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); margin: 2px 0 6px; }
.inboxMore { font-size: 11.5px; color: #8A6F2E; margin-top: 9px; text-align: center; }

/* 붙여넣기 */
.pasteBox { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 12px 13px; }
.pasteHint { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 8px; }
.pasteArea {
  width: 100%; min-height: 62px; border: none; outline: none; resize: vertical;
  font-size: 15px; background: transparent; line-height: 1.55;
}
.pasteArea::placeholder { color: #A9A08A; }
.pasteActs { display: flex; justify-content: flex-end; gap: 7px; margin-top: 8px; }

/* 카드 */
.card { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 13px; margin-top: 12px; }
.cardLabel { font-size: 12px; color: var(--ink-soft); margin-bottom: 9px; font-weight: 600; }
.warn {
  background: #F5EAD2; border: 1px solid #D9BE84; color: #7A5A17;
  font-size: 12px; line-height: 1.6; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px;
  display: flex; gap: 6px; align-items: flex-start;
}
.warn svg { flex-shrink: 0; margin-top: 2px; }

/* 폼 */
.form { display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--paper-line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.segBtn { border: none; background: var(--card); color: var(--ink-soft); padding: 7px 13px; font-size: 13px; font-weight: 600; }
.segBtn.on.expense { background: var(--ink); color: var(--paper); }
.segBtn.on.income { background: var(--income); color: #F3F7F1; }
.segBtn.on.transfer { background: #6B7280; color: #F3F4F6; }
.inp {
  border: 1px solid var(--paper-line); border-radius: 6px; padding: 8px 10px;
  font-size: 13.5px; background: var(--paper); outline: none; flex: 1; min-width: 0;
}
.inp:focus { border-color: var(--seal); background: var(--card); }
.inp.date { flex: 1; }
.inp.mini { border-radius: 14px; padding: 5px 10px; font-size: 12.5px; width: 108px; flex: none; }
.won { font-size: 19px; font-weight: 700; color: var(--ink-soft); }
.amt {
  flex: 1; border: none; border-bottom: 2px solid var(--paper-line); background: transparent;
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 3px 2px; outline: none;
}
.amt:focus { border-bottom-color: var(--seal); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { border: 1px solid; background: transparent; border-radius: 14px; font-size: 12.5px; padding: 5px 10px; font-weight: 500; }
.chip.sm { font-size: 11.5px; padding: 4px 9px; }
.chip.on { color: #FFFDF7 !important; font-weight: 700; }
.chip.dash { border-style: dashed; border-color: var(--paper-line); color: var(--ink-soft); }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--paper-line); background: var(--card); color: var(--ink-soft);
  border-radius: 14px; font-size: 12.5px; padding: 5px 10px; font-weight: 500;
}
.tag.on { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 700; }
.tag.dash { border-style: dashed; }
.inline { display: inline-flex; align-items: center; gap: 4px; }
.round { border: none; background: var(--seal); color: #FBF3E7; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.miniLabel { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }
.hint { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
.hint.sm { font-size: 11.5px; }
.acts { display: flex; justify-content: flex-end; gap: 7px; margin-top: 3px; width: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 6px; font-size: 13.5px; font-weight: 600; padding: 9px 14px; border: 1px solid; }
.btn.sm { font-size: 12.5px; padding: 7px 11px; }
.btn.ghost { background: transparent; border-color: var(--paper-line); color: var(--ink-soft); }
.btn.primary { background: var(--seal); border-color: var(--seal); color: #FBF3E7; }
.btn:disabled { opacity: 0.38; }

/* 다건 미리보기 */
.multiList { max-height: 268px; overflow-y: auto; border: 1px solid var(--paper-line); border-radius: 6px; }
.multiRow {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px;
  border-bottom: 1px dashed var(--paper-line);
}
.multiRow:last-child { border-bottom: none; }
.multiRow.skip { opacity: 0.45; }
.multiRow.review { background: #FAF3E3; }
.multiDate { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12px; flex-shrink: 0; width: 38px; }
.multiMemo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multiAmt { font-variant-numeric: tabular-nums; font-weight: 700; flex-shrink: 0; font-size: 12.5px; }

/* 검색 */
.search {
  display: flex; align-items: center; gap: 7px; margin-top: 14px;
  background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 8px 11px;
}
.searchIco { color: var(--ink-soft); flex-shrink: 0; }
.searchInp { flex: 1; border: none; outline: none; background: transparent; font-size: 13.5px; min-width: 0; }
.searchInp::placeholder { color: #A9A08A; }
.clear { border: none; background: none; color: var(--ink-soft); padding: 2px; }
.results { margin-top: 12px; }
.resultHead { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }

/* 탭 */
.tabs { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.tab {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--paper-line); background: transparent; color: var(--ink-soft);
  font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 14px;
}
.tab.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* 월 이동 */
.monthBar { display: flex; align-items: center; justify-content: space-between; margin: 15px 0 6px; }
.nav { background: none; border: none; color: var(--ink-soft); padding: 4px; }
.monthLabel { font-family: var(--serif); font-weight: 700; font-size: 16px; }
.totals { display: flex; gap: 11px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.inc { color: var(--income); }
.exp { color: var(--seal); }

/* 4축 요약 */
.axes { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 4px 13px; }
.axis { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
.axis:last-child { border-bottom: none; }
.axisLabel { font-size: 13px; color: var(--ink-soft); }
.axisVal { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.axis.total { border-top: 1px solid var(--paper-line); border-bottom: none; }
.axis.total .axisLabel { color: var(--ink); font-weight: 600; }
.axis.total .axisVal { color: var(--seal); font-size: 17px; }
.axis.income .axisVal { color: var(--income); }
.axis.welfare { opacity: 0.72; }
.axis.welfare .axisVal { color: var(--ink-soft); }
.welfareBar { padding: 10px 0 4px; border-top: 1px dashed var(--paper-line); }
.welfareTop { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-soft); }
.welfareTop b { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); font-family: var(--serif); }
.welfareTop b.over { color: var(--seal); }
.welfareGauge { height: 5px; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 3px; margin: 7px 0 5px; overflow: hidden; }
.welfareFill { height: 100%; background: var(--seal); opacity: 0.62; }
.welfareSub { font-size: 11px; color: var(--ink-soft); line-height: 1.5; }
.axisNote { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--paper-line); border-radius: 8px; padding: 1px 5px; margin-left: 4px; }

/* 목록 */
.group { margin-top: 13px; }
.groupHead {
  font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
  padding-bottom: 5px; border-bottom: 1px solid var(--paper-line); margin-bottom: 2px;
}
.rowWrap { border-bottom: 1px dashed var(--paper-line); }
.entry { display: flex; align-items: center; gap: 9px; padding: 10px 2px; user-select: none; }
.entry.pending { background: #FAF3E3; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.entryMain { flex: 1; min-width: 0; }
.entryCat { font-size: 11.5px; color: var(--ink-soft); }
.entryMemo { font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entryAmt { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
.amtNum { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.amtNum.income { color: var(--income); }
.amtNum.transfer { color: var(--ink-soft); font-style: italic; }
.amtNum.refunded { text-decoration: line-through; color: var(--ink-soft); }
.fx { font-size: 10.5px; color: var(--ink-soft); margin-top: 1px; }
.seal { color: var(--seal); font-weight: 600; }
.refund { color: var(--ink-soft); }
.del { background: none; border: none; color: #B0A48A; padding: 4px; flex-shrink: 0; }
.quickCat { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 2px 10px; }

/* 요약 카드 */
.cards { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; align-items: center; }
.sumCard { border: 1px solid var(--paper-line); background: var(--card); border-radius: 8px; padding: 9px 12px; text-align: left; min-width: 104px; }
.sumCard.on { border-color: var(--seal); background: #FFF9EF; }
.sumName { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.sumAmt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 3px; }

/* 박스 (주행거리·정비) */
.box { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 11px 13px; margin-top: 11px; }
.boxTop { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; font-weight: 700; }
.boxTop > span:first-child { display: flex; align-items: center; gap: 5px; }
.muted { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.logList { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.log { font-size: 11px; color: var(--ink-soft); }
.maintList { display: flex; flex-direction: column; }
.maintName { display: flex; align-items: center; gap: 5px; }
.maintSub { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; flex-shrink: 0; }
.badge.ok { background: #E7EFE7; color: var(--income); }
.badge.warning { background: #F5EAD2; color: #8A6417; }
.badge.overdue { background: #F5DDD6; color: var(--seal); }
.badge.unknown { background: #EDEAE0; color: var(--ink-soft); }
.quoteHead { font-size: 12px; color: var(--ink-soft); padding: 9px 0 5px; border-top: 1px dashed var(--paper-line); margin-top: 8px; }

.fuelTag { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--paper-line); border-radius: 8px; padding: 1px 6px; margin-left: 6px; font-family: var(--sans); font-weight: 500; }

.carSpan { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; padding: 2px 2px 6px; }

.carSpend { margin-top: 16px; }

/* 설정 */
.settings .setRow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
.settings .setRow > span { width: 74px; flex-shrink: 0; color: var(--ink-soft); }
.setDivider.danger { color: var(--seal); border-top-color: #D9BE84; }
.dangerBox { background: #F7EFDC; border: 1px solid #D9BE84; border-radius: 8px; padding: 11px 12px; margin-top: 8px; font-size: 12.5px; line-height: 1.6; color: #7A5A17; }
.dangerNote { font-size: 11.5px; margin-top: 7px; padding-top: 7px; border-top: 1px dashed #D9BE84; }
.btn.danger { background: var(--seal); border-color: var(--seal); color: #FBF3E7; }
.setStat { font-size: 12px; color: var(--ink-soft); margin: 12px 0 4px; }

/* 동기화 배지 */
.syncDot {
  position: absolute; left: 0; top: 2px; background: none; border: none;
  color: var(--ink-soft); font-size: 11px; padding: 6px; line-height: 1;
}
.syncDot.ok { color: var(--income); }
.syncDot.syncing { color: var(--ink-soft); }
.syncDot.error { color: var(--ink-soft); }
.syncDot.bad { color: var(--seal); font-weight: 700; }
.setDivider {
  font-size: 11px; font-weight: 700; color: var(--ink-soft);
  border-top: 1px solid var(--paper-line); padding-top: 10px; margin: 14px 0 9px;
}

/* 도구 줄 */
.toolRow { display: flex; gap: 6px; margin-top: 14px; justify-content: center; }
.toolBtn {
  border: 1px dashed var(--paper-line); background: transparent; color: var(--ink-soft);
  font-size: 12px; padding: 6px 11px; border-radius: 14px;
}

/* 고정비 */
.fixedWrap { margin-top: 14px; }
.suggest { background: #F7EFDC; border: 1px solid #D9BE84; border-radius: 8px; padding: 11px 13px; margin-bottom: 12px; }
.suggestHead { font-size: 13px; font-weight: 700; color: #7A5A17; margin-bottom: 8px; }
.suggestRow { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 4px 0; }
.sName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sAmt { font-variant-numeric: tabular-nums; font-weight: 700; }
.sDay { font-size: 11px; color: #8A6F2E; width: 62px; text-align: right; }
.fixedHead {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
  padding-bottom: 5px; border-bottom: 1px solid var(--paper-line);
}
.fixedSum { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.fixedRow { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed var(--paper-line); font-size: 14px; }
.fixedMark { width: 15px; text-align: center; font-size: 12px; flex-shrink: 0; }
.fixedMark.done { color: var(--income); }
.fixedMark.wait { color: var(--ink-soft); }
.fixedMark.late { color: var(--seal); font-weight: 700; }
.fixedDay { font-size: 11.5px; color: var(--ink-soft); width: 30px; flex-shrink: 0; }
.fixedName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fixedAmt { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }
.fixedRow.late .fixedAmt { color: var(--seal); }
.fixedLate { font-size: 11.5px; color: #8A6F2E; padding: 0 2px 8px 53px; line-height: 1.5; }
.addFixed { margin-top: 10px; }

/* 그룹 검수 */
.groupList { max-height: 380px; overflow-y: auto; margin-top: 10px; }
.groupRow { padding: 9px 0; border-bottom: 1px dashed var(--paper-line); }
.groupRow.settled { opacity: 0.5; }
.groupTop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.gName { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gMeta { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }

/* 자산 */
.assetWrap { margin-top: 14px; }
.assetTotal {
  display: flex; justify-content: space-between; align-items: baseline;
  background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px;
  padding: 13px; margin-bottom: 10px;
}
.assetTotalLabel { font-size: 13px; color: var(--ink-soft); }
.assetTotalVal { font-family: var(--serif); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.acctRow { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-bottom: 1px dashed var(--paper-line); }
.acctKind { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--paper-line); border-radius: 8px; padding: 2px 6px; flex-shrink: 0; }
.acctName { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acctLast4 { color: var(--ink-soft); font-size: 12px; }

.planCard .cardLabel { display: flex; justify-content: space-between; align-items: center; }
.planArea { min-height: 120px; }
.planRaw { white-space: pre-wrap; font-size: 11.5px; color: var(--ink-soft); max-height: 300px; overflow: auto; background: #0000000a; padding: 8px; border-radius: 8px; }
.planToday { border: 1px solid var(--seal); border-radius: 10px; padding: 9px 10px; margin: 8px 0; background: var(--seal-soft); }
.planTodayHead { font-family: var(--serif); font-weight: 700; margin-bottom: 6px; }
.planDays { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.planDay { border-top: 1px dashed var(--paper-line); padding: 7px 0; }
.planDay summary { cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.planSum { color: var(--ink-soft); font-size: 12px; }
.planKinds { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0; }
.planItem { display: flex; gap: 4px; font-size: 12.5px; padding: 2px 0; align-items: baseline; width: 100%; }
.planMark { flex-shrink: 0; width: 26px; min-height: 26px; font-size: 13px; color: #B0A48A; background: none; border: none; padding: 0; cursor: pointer; }
.planBody { flex: 1; min-width: 0; display: flex; gap: 7px; align-items: baseline; background: none; border: none; padding: 3px 0;
  text-align: left; color: inherit; font: inherit; cursor: pointer; }
.planNote { display: block; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.planItem.mk-skip .planNote { text-decoration: none; }
.planAdd { margin: 4px 0 2px 30px; }
.planEdit { margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.chip.static { cursor: default; }
.settleMode { margin: 4px 0; gap: 6px; }
.planItem.mk-done { color: #9A9080; }
.planItem.mk-done .planMark { color: var(--income); }
.planItem.mk-skip { color: var(--seal); text-decoration: line-through; text-decoration-color: var(--seal); }
.planItem.mk-skip .planMark { color: var(--seal); text-decoration: none; }
.planTime { flex-shrink: 0; width: 42px; color: var(--seal); font-weight: 600; font-size: 11.5px; }
.planText { flex: 1; min-width: 0; line-height: 1.5; }
.planCost { flex-shrink: 0; color: var(--ink-soft); font-size: 11.5px; }
.planTotal { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--paper-line); font-size: 13px; text-align: right; }
/* ============================================================
   v40 — 정돈된 종이 장부 · 화면 폭별 배치 · 움직임
   ============================================================ */
:root {
  --paper: #F4EEE3;
  --paper-line: #E2D6BF;
  --card: #FFFDF9;
  --ink: #26303B;
  --ink-soft: #7A7468;
  --seal: #A8372A;
  --seal-soft: #A8372A1A;
  --income: #2F6B4C;
  --shadow: 0 1px 2px #5A46281A, 0 4px 14px #5A46280F;
  --divider: #EFE6D6;
  --warm: #F7EFE0;
  --warm-line: #E6D3AE;
  --warm-ink: #74561C;
  --hover: #5A46280D;
  --safe: #2E64A8;
  --safe-soft: #2E64A81F;
  --over-soft: #A8372A14;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
body { background: var(--paper); }
.app { padding-top: max(18px, env(safe-area-inset-top)); }

/* 머리 */
.head { margin-bottom: 6px; }
.title { font-size: 24px; letter-spacing: 6px; }
.rule { width: 28px; height: 2px; margin: 6px auto 6px; }
.sub { font-size: 11.5px; letter-spacing: 0.5px; }

/* 탭 */
.tabs { gap: 4px; background: #E9E0CF; border-radius: 999px; padding: 3px; width: fit-content; margin: 14px auto 0; }
.tab { border: none; padding: 7px 16px; border-radius: 999px; }
.tab.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px #0000001f; }
.monthBar { margin: 18px 0 8px; }
.monthLabel { font-size: 19px; letter-spacing: 1px; }
.summaryToggle { margin-bottom: 8px; }
.sumTab { border: none; background: transparent; font-weight: 600; }
.sumTab.on { background: var(--ink); color: var(--paper); }

/* 카드 */
.axes, .card, .stats, .report, .search, .box, .pasteBox, .assetTotal, .tripSum {
  border: none; border-radius: 14px; box-shadow: var(--shadow);
}
.suggest, .inbox, .checkCard, .dangerBox { border-radius: 14px; border-color: var(--warm-line); background: var(--warm); }
.suggestHead, .inboxHead, .tidyHead { color: var(--warm-ink); }
.btn { border-radius: 10px; }
.btn.primary { box-shadow: 0 2px 6px #A8372A33; }

/* 요약: 지출 합계를 맨 위에 크게 */
.axes { padding: 6px 18px; display: flex; flex-direction: column; overflow: hidden; }
.axis { padding: 11px 0; border-bottom-style: solid; border-bottom-color: var(--divider); }
.axis.total { order: -2; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 0 6px; border-top: none; border-bottom: none; }
.axis.total .axisLabel { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.axis.total .axisVal { font-family: var(--serif); font-size: 31px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.axisVal { font-size: 15px; }
.axisHeld { order: -1; }

/* 이번 달 지출 흐름 */
.pace { order: -1; padding: 2px 0 12px; border-bottom: 1px solid var(--divider); }
.paceSvg { width: 100%; height: 64px; display: block; overflow: visible; }
.paceBefore { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; stroke-dasharray: 3 4; opacity: .45; vector-effect: non-scaling-stroke; }
.paceSvg { animation: reveal 1.1s var(--ease) both .15s; }
.paceNow { fill: none; stroke: var(--safe); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.paceNow.over { stroke: var(--seal); }
.paceOverZone { fill: var(--over-soft); }
.paceIncome { stroke: var(--safe); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; vector-effect: non-scaling-stroke; }
.paceBox { position: relative; }
.paceIncomeLabel { position: absolute; right: 0; transform: translateY(-120%); font-size: 10.5px; font-weight: 600; color: var(--safe);
  background: var(--card); padding: 0 4px; border-radius: 4px; font-variant-numeric: tabular-nums; animation: fade .6s ease both .9s; }
.paceDot.over { fill: var(--seal); }
.paceNote .safe, .safe { color: var(--safe); }
.axis.total.safe .axisVal { color: var(--safe); }
.axis.total.over .axisVal { color: var(--seal); }

/* 수입 대비 지출 */
.balance { order: -1; padding: 6px 0 10px; }
.balTrack { position: relative; height: 8px; border-radius: 99px; background: var(--safe-soft); overflow: hidden; }
.balFill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--safe); transform-origin: left; animation: grow .9s var(--ease) both .2s; }
.balance.over .balFill { background: var(--safe); opacity: .55; }
.balOver { position: absolute; right: 0; top: 0; bottom: 0; background: var(--seal); border-radius: 99px 0 0 99px; transform-origin: right; animation: grow .6s var(--ease) both 1s; }
.balText { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: 12.5px; color: var(--ink-soft); }
.balText b { color: var(--ink); font-variant-numeric: tabular-nums; }
.balLeft b { color: var(--safe); }
.balance.over .balLeft b, .balance.over .balText > span:first-child b { color: var(--seal); }

/* 최근 6개월 수지 (넓은 화면) */
.netCard { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 12px; margin-bottom: 14px; animation: rise .5s var(--ease) both .1s; }
.netHead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.netTotal { font-family: var(--serif); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.netTotal.plus, .netRow .plus { color: var(--safe); }
.netTotal.minus, .netRow .minus { color: var(--seal); }
.netChart { display: flex; gap: 8px; height: 150px; margin-top: 10px; }
.netCol { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; border-radius: 8px; padding: 2px 0; }
.netCol.on { background: var(--hover); }
.netVal { font-size: 10.5px; color: var(--ink-soft); height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.netUp, .netDown { flex: 1; width: 60%; display: flex; }
.netUp { align-items: flex-end; border-bottom: 1px solid var(--paper-line); }
.netDown { align-items: flex-start; }
.netUp i, .netDown i { display: block; width: 100%; }
.netUp i { background: var(--safe); border-radius: 4px 4px 0 0; transform-origin: bottom; animation: growY .7s var(--ease) both calc(.2s + var(--d)); }
.netDown i { background: var(--seal); border-radius: 0 0 4px 4px; transform-origin: top; animation: growY .7s var(--ease) both calc(.2s + var(--d)); }
.netMonth { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
.netCol.on .netMonth { color: var(--ink); font-weight: 700; }
.netRows { margin-top: 10px; border-top: 1px solid var(--divider); }
.netRow { display: grid; grid-template-columns: 34px 1fr 1fr auto; gap: 6px; align-items: baseline; font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--divider); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.netRow:last-child { border-bottom: none; }
.netRow b { font-size: 13px; }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.paceDot { fill: var(--safe); stroke: var(--card); stroke-width: 2; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center;
  animation: dotIn .4s var(--ease) both 1.1s, pulse 2.4s ease-in-out 1.6s infinite; }
.paceNote { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.paceNote b { font-variant-numeric: tabular-nums; }
.paceLegend { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
.paceLegend i { display: inline-block; width: 12px; height: 0; border-top: 2px solid var(--safe); margin-left: 6px; }
.paceLegend i.lgBefore { border-top: 2px dashed var(--ink-soft); opacity: .6; }

/* 검색·도구 */
.search { padding: 11px 14px; margin-top: 16px; }
.toolRow { gap: 8px; }
.toolBtn { border: 1px solid var(--paper-line); background: var(--card); color: var(--ink); font-weight: 500; padding: 7px 13px; }

/* 목록: 날짜별 카드 */
.group { margin-top: 20px; }
.groupHead { border-bottom: none; font-size: 12px; letter-spacing: 0.3px; padding: 0 4px 6px; }
.groupHead + .rowWrap { border-top-left-radius: 14px; border-top-right-radius: 14px; }
.rowWrap { background: var(--card); border-bottom: 1px solid #F1E9DA; }
.rowWrap:last-child { border-bottom: none; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; box-shadow: 0 4px 10px -6px #5A46281f; }
.entry { padding: 12px 14px; gap: 12px; border-radius: 14px; }
.dot { width: 32px; height: 32px; border-radius: 10px; position: relative; overflow: hidden; }
.dot::after { content: ""; position: absolute; inset: 0; background: var(--card); opacity: 0.8; }
.dot::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: inherit; z-index: 1; }
.entryMain { display: flex; flex-direction: column; }
.entryCat { font-size: 11px; order: 2; margin-top: 1px; }
.entryMemo { font-size: 15px; font-weight: 600; }
.amtNum { font-size: 15.5px; }
.del { opacity: 0.35; padding: 2px; }
.fixedHead, .listHead { padding-left: 4px; padding-right: 4px; }

/* 화면 폭별 배치 — 휴대폰은 한 줄, 컴퓨터·태블릿은 2단 */
.side, .main { display: contents; }
.wideOnly { display: none; }
@media (min-width: 900px) {
  .app { max-width: 1180px; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 28px; align-items: start; padding: 32px 32px 64px; }
  .side, .main { display: block; min-width: 0; }
  .side { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; padding: 2px 6px 24px 2px; scrollbar-width: thin; }
  .main { padding-top: 6px; }
  .head { text-align: left; }
  .rule { margin-left: 0; }
  .tabs { margin-left: 0; }
  .toolRow { justify-content: flex-start; flex-wrap: wrap; }
  .wideOnly { display: block; margin-top: 14px; }
  .paceSvg { height: 76px; }
}
@media (min-width: 1280px) {
  .app { max-width: 1200px; grid-template-columns: 400px minmax(0, 1fr); gap: 40px; }
}

/* 움직임 */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fromR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes fromL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes reveal { from { clip-path: inset(-10px 100% -10px 0); } to { clip-path: inset(-10px -10px -10px 0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes dotIn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
@keyframes donutIn { from { transform: rotate(-270deg) scale(.6); opacity: 0; } to { transform: rotate(-90deg) scale(1); opacity: 1; } }

.axes { animation: pop .45s var(--ease) both; }
.axes.fromR { animation-name: fromR; }
.axes.fromL { animation-name: fromL; }
.search, .toolRow, .suggest, .checkCard, .inbox, .card, .stats, .report { animation: rise .45s var(--ease) both; }
.search { animation-delay: .06s; }
.toolRow { animation-delay: .1s; }
.suggest, .checkCard, .inbox { animation-delay: .14s; }
.group { animation: rise .5s var(--ease) both; }
.group:nth-of-type(1) { animation-delay: .1s; }
.group:nth-of-type(2) { animation-delay: .15s; }
.group:nth-of-type(3) { animation-delay: .2s; }
.group:nth-of-type(4) { animation-delay: .25s; }
.group:nth-of-type(5) { animation-delay: .3s; }
.group:nth-of-type(6) { animation-delay: .35s; }
.group:nth-of-type(n+7) { animation-delay: .4s; }
.catBarFill, .repBarNow, .welfareFill { transform-origin: left; animation: grow .8s var(--ease) both .15s; }
.donut { animation: donutIn .9s var(--ease) both; }
.bar { transform-origin: bottom; animation: rise .6s var(--ease) both; }
.toast { animation: rise .3s var(--ease) both; }

.btn, .tab, .sumTab, .toolBtn, .tag, .chip, .linkBtn, .nav, .gear, .statTab { transition: transform .12s ease, background-color .2s ease, color .2s ease, box-shadow .2s ease; }
.btn:active, .tab:active, .sumTab:active, .toolBtn:active, .tag:active, .chip:active, .statTab:active, .nav:active { transform: scale(0.95); }
.entry { transition: background-color .18s ease, transform .18s ease; }
.entry:active { transform: scale(0.985); }
@media (hover: hover) {
  .entry:hover { background: var(--hover); }
  .toolBtn:hover, .tab:not(.on):hover, .sumTab:not(.on):hover { transform: translateY(-1px); }
  .group { transition: transform .25s ease; }
  .del { transition: opacity .15s ease; }
  .entry:hover .del { opacity: .8; }
}

/* 다크 모드 — 홈 화면에 추가한 앱으로 열었을 때만 (브라우저에서는 늘 밝게) */
@media (display-mode: standalone) and (prefers-color-scheme: dark) {
  :root {
    --paper: #1B1914;
    --paper-line: #3A342A;
    --card: #25221C;
    --ink: #EDE6D8;
    --ink-soft: #A39A88;
    --seal: #E0705C;
    --seal-soft: #E0705C22;
    --income: #7CC29A;
    --shadow: 0 1px 2px #0000004d, 0 4px 14px #00000033;
    --divider: #322D25;
    --warm: #2C271D;
    --warm-line: #4A3F2B;
    --warm-ink: #E2C584;
    --hover: #FFFFFF0A;
    --safe: #6FA3E8;
    --safe-soft: #6FA3E826;
    --over-soft: #E0705C1A;
  }
  .tabs { background: #2A261F; }
  .tab.on { background: #3A352C; }
  .rowWrap { border-bottom-color: #2F2B24; }
  .dot::after { opacity: 0.72; }
  .sDay, .inboxSub, .inboxHint, .inboxBulk, .inboxMore, .dangerBox, .fixedLate, .acctWarn { color: #BFA670; }
  .btn.primary, .btn.danger, .statTab.on, .round, .soloTag.on, .bulkBtn.on { color: #1B1914; }
  .btn.primary { box-shadow: none; }
  .warn, .repNote.warn { background: var(--warm); border-color: var(--warm-line); color: var(--warm-ink); }
  .inbox.warn, .badge.overdue { background: #3A221C; border-color: #5A3328; }
  .inbox.warn .inboxHead, .inbox.warn .inboxBulk { color: #F0A08F; }
  .entry.pending, .multiRow.review, .sumCard.on { background: #2E2A20; }
  .badge.ok { background: #1F3328; }
  .badge.warning { background: #3A3020; color: #E2C584; }
  .badge.unknown { background: #2C2A25; }
  .catBarTrack, .repBarTrack, .welfareGauge, .tidyResult, .foundTrip, .pickHead, .repTop, .repNote, .ruleBox { background: #1F1D18; }
  .inp { background: #1F1D18; }
  .inp:focus { background: var(--card); }
  .carBreakBar, .planRaw { background: #FFFFFF12; }
  .bulkBar { background: var(--card); color: var(--ink); }
  .toast { background: #EDE6D8; color: #1B1914; }
  .donutTop, .donutNum { fill: var(--ink); }
  .pasteArea::placeholder, .searchInp::placeholder { color: #7A7262; }
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
