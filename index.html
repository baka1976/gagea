<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F2E9D8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="가계부" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
<style>
:root {
  --paper: #F2E9D8;
  --paper-line: #DCCBA0;
  --card: #FFFDF7;
  --ink: #2B3A4A;
  --ink-soft: #6B7280;
  --seal: #B23A24;
  --seal-soft: #B23A2422;
  --income: #3D6B4F;
  --serif: 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--paper-line) 28px), var(--paper);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

.app {
  max-width: 460px; margin: 0 auto;
  padding: max(24px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
}

/* 헤더 */
.head { text-align: center; margin-bottom: 16px; position: relative; }
.gear { position: absolute; right: 0; top: 2px; background: none; border: none; color: var(--ink-soft); padding: 6px; }
.title { font-family: var(--serif); font-weight: 800; font-size: 29px; letter-spacing: 2px; margin: 0; }
.rule { width: 46px; height: 3px; background: var(--seal); margin: 6px auto 9px; border-radius: 2px; }
.sub { font-size: 12.5px; color: var(--ink-soft); }

/* 검수함 */
.inbox { background: #F7EFDC; border: 1px solid #D9BE84; border-radius: 8px; padding: 12px 13px; margin-bottom: 12px; }
.inboxHead { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #7A5A17; margin-bottom: 9px; }
.inboxItem { border-top: 1px dashed #D9BE84; padding-top: 9px; margin-top: 9px; }
.inboxItem:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.inboxTop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.inboxMemo { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inboxAmt { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.inboxSub { font-size: 11.5px; color: #8A6F2E; margin: 3px 0 7px; }
.inboxHint { font-size: 10.5px; font-weight: 500; color: #8A6F2E; margin-left: auto; }
.inboxBulk { font-size: 12px; color: #7A5A17; line-height: 1.6; padding: 8px 0 2px; border-top: 1px dashed #D9BE84; margin-top: 8px; }
.inboxBulk .btn { margin-top: 7px; }
.inboxMore { font-size: 11.5px; color: #8A6F2E; margin-top: 9px; text-align: center; }

/* 붙여넣기 */
.pasteBox { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 12px 13px; }
.pasteHint { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 8px; }
.pasteArea {
  width: 100%; min-height: 62px; border: none; outline: none; resize: vertical;
  font-size: 15px; background: transparent; line-height: 1.55;
}
.pasteArea::placeholder { color: #A9A08A; }
.pasteActs { display: flex; justify-content: flex-end; gap: 7px; margin-top: 8px; }

/* 카드 */
.card { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 13px; margin-top: 12px; }
.cardLabel { font-size: 12px; color: var(--ink-soft); margin-bottom: 9px; font-weight: 600; }
.warn {
  background: #F5EAD2; border: 1px solid #D9BE84; color: #7A5A17;
  font-size: 12px; line-height: 1.6; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px;
  display: flex; gap: 6px; align-items: flex-start;
}
.warn svg { flex-shrink: 0; margin-top: 2px; }

/* 폼 */
.form { display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--paper-line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.segBtn { border: none; background: var(--card); color: var(--ink-soft); padding: 7px 13px; font-size: 13px; font-weight: 600; }
.segBtn.on.expense { background: var(--ink); color: var(--paper); }
.segBtn.on.income { background: var(--income); color: #F3F7F1; }
.segBtn.on.transfer { background: #6B7280; color: #F3F4F6; }
.inp {
  border: 1px solid var(--paper-line); border-radius: 6px; padding: 8px 10px;
  font-size: 13.5px; background: var(--paper); outline: none; flex: 1; min-width: 0;
}
.inp:focus { border-color: var(--seal); background: var(--card); }
.inp.date { flex: 1; }
.inp.mini { border-radius: 14px; padding: 5px 10px; font-size: 12.5px; width: 108px; flex: none; }
.won { font-size: 19px; font-weight: 700; color: var(--ink-soft); }
.amt {
  flex: 1; border: none; border-bottom: 2px solid var(--paper-line); background: transparent;
  font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 3px 2px; outline: none;
}
.amt:focus { border-bottom-color: var(--seal); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { border: 1px solid; background: transparent; border-radius: 14px; font-size: 12.5px; padding: 5px 10px; font-weight: 500; }
.chip.sm { font-size: 11.5px; padding: 4px 9px; }
.chip.on { color: #FFFDF7 !important; font-weight: 700; }
.chip.dash { border-style: dashed; border-color: var(--paper-line); color: var(--ink-soft); }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--paper-line); background: var(--card); color: var(--ink-soft);
  border-radius: 14px; font-size: 12.5px; padding: 5px 10px; font-weight: 500;
}
.tag.on { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 700; }
.tag.dash { border-style: dashed; }
.inline { display: inline-flex; align-items: center; gap: 4px; }
.round { border: none; background: var(--seal); color: #FBF3E7; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.miniLabel { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }
.hint { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
.hint.sm { font-size: 11.5px; }
.acts { display: flex; justify-content: flex-end; gap: 7px; margin-top: 3px; width: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 6px; font-size: 13.5px; font-weight: 600; padding: 9px 14px; border: 1px solid; }
.btn.sm { font-size: 12.5px; padding: 7px 11px; }
.btn.ghost { background: transparent; border-color: var(--paper-line); color: var(--ink-soft); }
.btn.primary { background: var(--seal); border-color: var(--seal); color: #FBF3E7; }
.btn:disabled { opacity: 0.38; }

/* 다건 미리보기 */
.multiList { max-height: 268px; overflow-y: auto; border: 1px solid var(--paper-line); border-radius: 6px; }
.multiRow {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px;
  border-bottom: 1px dashed var(--paper-line);
}
.multiRow:last-child { border-bottom: none; }
.multiRow.skip { opacity: 0.45; }
.multiRow.review { background: #FAF3E3; }
.multiDate { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12px; flex-shrink: 0; width: 38px; }
.multiMemo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multiAmt { font-variant-numeric: tabular-nums; font-weight: 700; flex-shrink: 0; font-size: 12.5px; }

/* 검색 */
.search {
  display: flex; align-items: center; gap: 7px; margin-top: 14px;
  background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 8px 11px;
}
.searchIco { color: var(--ink-soft); flex-shrink: 0; }
.searchInp { flex: 1; border: none; outline: none; background: transparent; font-size: 13.5px; min-width: 0; }
.searchInp::placeholder { color: #A9A08A; }
.clear { border: none; background: none; color: var(--ink-soft); padding: 2px; }
.results { margin-top: 12px; }
.resultHead { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }

/* 탭 */
.tabs { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.tab {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--paper-line); background: transparent; color: var(--ink-soft);
  font-size: 12.5px; font-weight: 600; padding: 6px 13px; border-radius: 14px;
}
.tab.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* 월 이동 */
.monthBar { display: flex; align-items: center; justify-content: space-between; margin: 15px 0 6px; }
.nav { background: none; border: none; color: var(--ink-soft); padding: 4px; }
.monthLabel { font-family: var(--serif); font-weight: 700; font-size: 16px; }
.totals { display: flex; gap: 11px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.inc { color: var(--income); }
.exp { color: var(--seal); }

/* 4축 요약 */
.axes { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 4px 13px; }
.axis { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--paper-line); }
.axis:last-child { border-bottom: none; }
.axisLabel { font-size: 13px; color: var(--ink-soft); }
.axisVal { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.axis.total { border-top: 1px solid var(--paper-line); border-bottom: none; }
.axis.total .axisLabel { color: var(--ink); font-weight: 600; }
.axis.total .axisVal { color: var(--seal); font-size: 17px; }
.axis.income .axisVal { color: var(--income); }
.axis.welfare { opacity: 0.72; }
.axis.welfare .axisVal { color: var(--ink-soft); }
.welfareBar { padding: 10px 0 4px; border-top: 1px dashed var(--paper-line); }
.welfareTop { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink-soft); }
.welfareTop b { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); font-family: var(--serif); }
.welfareTop b.over { color: var(--seal); }
.welfareGauge { height: 5px; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 3px; margin: 7px 0 5px; overflow: hidden; }
.welfareFill { height: 100%; background: var(--seal); opacity: 0.62; }
.welfareSub { font-size: 11px; color: var(--ink-soft); line-height: 1.5; }
.axisNote { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--paper-line); border-radius: 8px; padding: 1px 5px; margin-left: 4px; }

/* 목록 */
.group { margin-top: 13px; }
.groupHead {
  font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
  padding-bottom: 5px; border-bottom: 1px solid var(--paper-line); margin-bottom: 2px;
}
.rowWrap { border-bottom: 1px dashed var(--paper-line); }
.entry { display: flex; align-items: center; gap: 9px; padding: 10px 2px; user-select: none; }
.entry.pending { background: #FAF3E3; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.entryMain { flex: 1; min-width: 0; }
.entryCat { font-size: 11.5px; color: var(--ink-soft); }
.entryMemo { font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entryAmt { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
.amtNum { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.amtNum.income { color: var(--income); }
.amtNum.transfer { color: var(--ink-soft); font-style: italic; }
.amtNum.refunded { text-decoration: line-through; color: var(--ink-soft); }
.fx { font-size: 10.5px; color: var(--ink-soft); margin-top: 1px; }
.seal { color: var(--seal); font-weight: 600; }
.refund { color: var(--ink-soft); }
.del { background: none; border: none; color: #B0A48A; padding: 4px; flex-shrink: 0; }
.quickCat { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 2px 10px; }

/* 요약 카드 */
.cards { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; align-items: center; }
.sumCard { border: 1px solid var(--paper-line); background: var(--card); border-radius: 8px; padding: 9px 12px; text-align: left; min-width: 104px; }
.sumCard.on { border-color: var(--seal); background: #FFF9EF; }
.sumName { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.sumAmt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 3px; }

/* 박스 (주행거리·정비) */
.box { background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px; padding: 11px 13px; margin-top: 11px; }
.boxTop { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; font-weight: 700; }
.boxTop > span:first-child { display: flex; align-items: center; gap: 5px; }
.muted { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
.logList { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.log { font-size: 11px; color: var(--ink-soft); }
.maintList { display: flex; flex-direction: column; }
.maintName { display: flex; align-items: center; gap: 5px; }
.maintSub { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; flex-shrink: 0; }
.badge.ok { background: #E7EFE7; color: var(--income); }
.badge.warning { background: #F5EAD2; color: #8A6417; }
.badge.overdue { background: #F5DDD6; color: var(--seal); }
.badge.unknown { background: #EDEAE0; color: var(--ink-soft); }
.quoteHead { font-size: 12px; color: var(--ink-soft); padding: 9px 0 5px; border-top: 1px dashed var(--paper-line); margin-top: 8px; }

.fuelTag { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--paper-line); border-radius: 8px; padding: 1px 6px; margin-left: 6px; font-family: var(--sans); font-weight: 500; }

.carSpan { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; padding: 2px 2px 6px; }

.carSpend { margin-top: 16px; }

/* 설정 */
.settings .setRow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
.settings .setRow > span { width: 74px; flex-shrink: 0; color: var(--ink-soft); }
.setDivider.danger { color: var(--seal); border-top-color: #D9BE84; }
.dangerBox { background: #F7EFDC; border: 1px solid #D9BE84; border-radius: 8px; padding: 11px 12px; margin-top: 8px; font-size: 12.5px; line-height: 1.6; color: #7A5A17; }
.dangerNote { font-size: 11.5px; margin-top: 7px; padding-top: 7px; border-top: 1px dashed #D9BE84; }
.btn.danger { background: var(--seal); border-color: var(--seal); color: #FBF3E7; }
.setStat { font-size: 12px; color: var(--ink-soft); margin: 12px 0 4px; }

/* 동기화 배지 */
.syncDot {
  position: absolute; left: 0; top: 2px; background: none; border: none;
  color: var(--ink-soft); font-size: 11px; padding: 6px; line-height: 1;
}
.syncDot.ok { color: var(--income); }
.syncDot.syncing { color: var(--ink-soft); }
.syncDot.error { color: var(--ink-soft); }
.syncDot.bad { color: var(--seal); font-weight: 700; }
.setDivider {
  font-size: 11px; font-weight: 700; color: var(--ink-soft);
  border-top: 1px solid var(--paper-line); padding-top: 10px; margin: 14px 0 9px;
}

/* 도구 줄 */
.toolRow { display: flex; gap: 6px; margin-top: 14px; justify-content: center; }
.toolBtn {
  border: 1px dashed var(--paper-line); background: transparent; color: var(--ink-soft);
  font-size: 12px; padding: 6px 11px; border-radius: 14px;
}

/* 고정비 */
.fixedWrap { margin-top: 14px; }
.suggest { background: #F7EFDC; border: 1px solid #D9BE84; border-radius: 8px; padding: 11px 13px; margin-bottom: 12px; }
.suggestHead { font-size: 13px; font-weight: 700; color: #7A5A17; margin-bottom: 8px; }
.suggestRow { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 4px 0; }
.sName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sAmt { font-variant-numeric: tabular-nums; font-weight: 700; }
.sDay { font-size: 11px; color: #8A6F2E; width: 62px; text-align: right; }
.fixedHead {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12.5px; color: var(--ink-soft); font-weight: 600;
  padding-bottom: 5px; border-bottom: 1px solid var(--paper-line);
}
.fixedSum { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.fixedRow { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed var(--paper-line); font-size: 14px; }
.fixedMark { width: 15px; text-align: center; font-size: 12px; flex-shrink: 0; }
.fixedMark.done { color: var(--income); }
.fixedMark.wait { color: var(--ink-soft); }
.fixedMark.late { color: var(--seal); font-weight: 700; }
.fixedDay { font-size: 11.5px; color: var(--ink-soft); width: 30px; flex-shrink: 0; }
.fixedName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fixedAmt { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; }
.fixedRow.late .fixedAmt { color: var(--seal); }
.fixedLate { font-size: 11.5px; color: #8A6F2E; padding: 0 2px 8px 53px; line-height: 1.5; }
.addFixed { margin-top: 10px; }

/* 그룹 검수 */
.groupList { max-height: 380px; overflow-y: auto; margin-top: 10px; }
.groupRow { padding: 9px 0; border-bottom: 1px dashed var(--paper-line); }
.groupRow.settled { opacity: 0.5; }
.groupTop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.gName { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gMeta { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex-shrink: 0; }

/* 자산 */
.assetWrap { margin-top: 14px; }
.assetTotal {
  display: flex; justify-content: space-between; align-items: baseline;
  background: var(--card); border: 1px solid var(--paper-line); border-radius: 8px;
  padding: 13px; margin-bottom: 10px;
}
.assetTotalLabel { font-size: 13px; color: var(--ink-soft); }
.assetTotalVal { font-family: var(--serif); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.acctRow { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-bottom: 1px dashed var(--paper-line); }
.acctKind { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--paper-line); border-radius: 8px; padding: 2px 6px; flex-shrink: 0; }
.acctName { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acctLast4 { color: var(--ink-soft); font-size: 12px; }
.acctBal { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
.acctWarn { font-size: 11.5px; color: #8A6F2E; padding: 0 2px 8px 8px; line-height: 1.5; }
.acctStale { font-size: 11px; color: var(--ink-soft); padding: 0 2px 8px 8px; }
.transferBox { margin-top: 18px; }
.tRow { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px dashed var(--paper-line); font-size: 13px; }
.tDate { font-size: 11.5px; color: var(--ink-soft); width: 34px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.tPath { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tAmt { font-variant-numeric: tabular-nums; font-weight: 600; }
.tHalf { color: var(--ink-soft); font-size: 12px; }

/* 정리 결과 */
.tidyResult {
  background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px;
  padding: 10px 12px; margin: 10px 0; font-size: 13px; line-height: 1.9;
}
.tidyResult b { font-variant-numeric: tabular-nums; }

.nameList { margin-bottom: 12px; }
.nameList .chips { margin-bottom: 7px; }
.tagX { border: none; background: none; color: inherit; padding: 0 0 0 3px; font-size: 14px; line-height: 1; opacity: 0.75; }
